name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: notifications_test
          MYSQL_USER: app
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uapp -psecret"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1
      DB_USERNAME: app
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, redis, pcntl
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        run: composer lint

      - name: Static analysis
        run: composer analyse

      - name: Tests
        run: composer test

  docker:
    runs-on: ubuntu-latest

    env:
      # Free webhook.site URLs have a request limit, CI should not use it up.
      NOTIFICATION_PROVIDER_URL: http://mock-provider:8080

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/health && exit 0
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Smoke test
        run: |
          id=$(curl -fsS -X POST http://localhost:8000/api/notifications \
            -H 'Content-Type: application/json' \
            -d '{"recipient":"+905551234567","channel":"sms","content":"CI smoke test"}' | jq -r .data.id)
          for i in $(seq 1 20); do
            status=$(curl -fsS http://localhost:8000/api/notifications/$id | jq -r .data.status)
            [ "$status" = "sent" ] && echo "delivered" && exit 0
            sleep 1
          done
          echo "notification was not delivered, last status: $status"
          docker compose logs horizon
          exit 1

      - name: Stop
        if: always()
        run: docker compose down -v
