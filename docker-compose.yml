x-app: &app
  build: .
  image: notification-service:local
  restart: unless-stopped
  environment:
    APP_NAME: notification-service
    APP_ENV: local
    APP_DEBUG: "false"
    APP_URL: http://localhost:8000
    APP_KEY: ${APP_KEY:-base64:1lQdJbfmATvhV9prXt6S4EltqWnoEmcmmLElC7e5BeQ=}
    LOG_CHANNEL: json
    LOG_LEVEL: info
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: notifications
    DB_USERNAME: app
    DB_PASSWORD: secret
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: array
    # The external provider is simulated with webhook.site, as the assessment asks.
    # For load / failure tests switch to the local mock: NOTIFICATION_PROVIDER_URL=http://mock-provider:8080
    NOTIFICATION_PROVIDER_URL: ${NOTIFICATION_PROVIDER_URL:-https://webhook.site/6ae5e09c-75d6-4a28-931b-91043e0fbef6}
    NOTIFICATION_RATE_LIMIT: ${NOTIFICATION_RATE_LIMIT:-100}
    HORIZON_PROCESSES: ${HORIZON_PROCESSES:-20}
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  migrate:
    <<: *app
    restart: "no"
    command: php artisan migrate --force
    depends_on:
      mysql:
        condition: service_healthy

  app:
    <<: *app

  horizon:
    <<: *app
    command: php artisan horizon

  scheduler:
    <<: *app
    command: php artisan schedule:work

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: notifications
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # AOF so queued jobs survive a redis restart; noeviction so jobs are never dropped under memory pressure.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock-provider:
    image: php:8.3-cli-alpine
    restart: unless-stopped
    command: php -S 0.0.0.0:8080 /app/index.php
    environment:
      # The built-in server handles one request at a time by default, which would cap the
      # whole system at ~20 req/s with 50ms latency. Run several workers instead.
      PHP_CLI_SERVER_WORKERS: 32
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-50}
    volumes:
      - ./docker/mock-provider:/app:ro

volumes:
  mysql-data:
  redis-data:
