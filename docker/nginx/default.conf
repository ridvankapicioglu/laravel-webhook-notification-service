server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # 1000 notifications * up to 10k chars (email) fit comfortably.
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Resolve "app" through Docker's DNS on every request instead of once at startup,
    # otherwise nginx keeps the old IP and answers 502 after the app container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
